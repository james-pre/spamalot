name: Release

on:
    release:
        types: [created]

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml
        permissions:
            contents: write
            id-token: write
            pages: write

    release:
        runs-on: ubuntu-latest
        needs: ci
        permissions:
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup npm authentication
              uses: actions/setup-node@v6
              with:
                  node-version: latest
                  registry-url: https://registry.npmjs.org/

            - name: Install native dependencies
              run: sudo apt-get install -y libflatpak-dev

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npx tsc -b

            - name: Resolve package
              id: resolve
              run: npx monorepo release resolve "$TAG"
              env:
                  TAG: ${{ github.event.release.tag_name }}

            - name: Publish
              run: npm publish --access=public --provenance ${{ github.event.release.prerelease && '--tag next' || '' }}
              working-directory: ${{ steps.resolve.outputs.path }}
